name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      # Tooling that `make setup` expects but cannot install itself on a bare
      # runner: uv (Python env), markdownlint-cli (lint-markdown), and hadolint
      # (lint-dockerfile). Installing them here keeps CI running the exact same
      # `make lint` / `make test` a developer runs locally — one source of truth.
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli
      - name: Install hadolint
        run: |
          sudo curl -fsSL -o /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
          sudo chmod +x /usr/local/bin/hadolint

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Setup
        run: make setup PYTHON_VERSION=${{ matrix.python-version }}
      - name: Lint
        run: make lint
      - name: Test
        run: make test
