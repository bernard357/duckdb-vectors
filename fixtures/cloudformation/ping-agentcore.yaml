AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Execution role for the duckdb-vectors Bedrock AgentCore ping agent. The
  AgentCore runtime assumes this role; duckdb-vectors inherits its credentials
  from that execution context. The runtime itself is created by the agentcore
  CLI (there is no mature CloudFormation resource for it).

Parameters:
  RoleName:
    Type: String
    Default: duckdb-vectors-ping-agentcore-role

Resources:
  AgentCoreExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: bedrock-invoke
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0"
                  - !Sub "arn:aws:bedrock:*::foundation-model/amazon.nova-pro-v1:0"
                  - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.amazon.nova-pro-v1:0"
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"

Outputs:
  RoleArn:
    Value: !GetAtt AgentCoreExecutionRole.Arn
