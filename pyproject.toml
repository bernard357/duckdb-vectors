[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "duckdb-vectors"
dynamic = ["version"]
description = "Frugal, embeddable semantic-search building block for agentic systems — hybrid vector + exact-token search over a local DuckDB file, no external vector database."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Bernard Paques", email = "bernard.paques@gmail.com" }]
keywords = [
    "duckdb",
    "vectors",
    "embeddings",
    "semantic-search",
    "rag",
    "bm25",
    "agents",
    "mcp",
    "llm",
    "vector-search",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = [
    "duckdb>=1.1",
    "pydantic>=2.6",
    "fastembed>=0.3",
    "typer>=0.12",
    "pyyaml>=6",
    "mcp>=2.3",
    "pypdf>=5",
    "pypdfium2>=4",
    "rapidocr-onnxruntime>=1.3,<2",
]

[project.optional-dependencies]
bedrock = ["boto3>=1.34"]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
duckdb-vectors = "duckdb_vectors.cli:app"

[project.urls]
Homepage = "https://github.com/bernard357/duckdb-vectors"
Repository = "https://github.com/bernard357/duckdb-vectors"
Documentation = "https://bernard357.github.io/duckdb-vectors/"
Issues = "https://github.com/bernard357/duckdb-vectors/issues"
Changelog = "https://github.com/bernard357/duckdb-vectors/blob/main/CHANGES.md"

# Version is derived from the latest git tag (e.g. a v0.1.0 tag yields 0.1.0).
# Between tags, hatch-vcs appends a dev/commit suffix. There is no version
# string to bump by hand: tag the release and the build picks it up.
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/duckdb_vectors"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: tests that take more than 200ms"]

[tool.mypy]
python_version = "3.12"
files = ["src/duckdb_vectors"]
warn_unused_ignores = true

# Optional-dependency backends ship no type stubs; their imports are lazy and
# isolated behind the embedder registry, so ignore their missing stubs rather
# than vendor third-party type packages.
[[tool.mypy.overrides]]
module = [
    "boto3",
    "fastembed",
    "huggingface_hub",
    "huggingface_hub.*",
    "llama_cpp",
    "mcp.*",
    "onnxruntime",
    "pypdf",
    "pypdf.*",
    "pypdfium2",
    "pypdfium2.*",
    "rapidocr_onnxruntime",
    "rapidocr_onnxruntime.*",
    "tokenizers",
    "yaml",
]
ignore_missing_imports = true
