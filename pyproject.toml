[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "duckdb-vectors"
version = "0.1.0"
description = "Embeddable semantic-search building block for agentic systems: an S3-Vectors-like interface over a local DuckDB database with hybrid vector + exact-token BM25 search."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Bernard Paques", email = "bernard.paques@gmail.com" }]
keywords = [
    "duckdb",
    "vectors",
    "embeddings",
    "semantic-search",
    "rag",
    "bm25",
    "agents",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = ["duckdb>=1.1", "pydantic>=2.6"]

[project.optional-dependencies]
local = ["fastembed>=0.3"]
bedrock = ["boto3>=1.34"]
cli = ["typer>=0.12"]
dev = ["pytest>=8.0", "ruff>=0.6", "typer>=0.12", "mypy>=1.11"]

[project.scripts]
duckdb-vectors = "duckdb_vectors.cli:app"

[project.urls]
Homepage = "https://github.com/bernard357/duckdb-vectors"
Repository = "https://github.com/bernard357/duckdb-vectors"
Documentation = "https://github.com/bernard357/duckdb-vectors/tree/main/documentation"
Issues = "https://github.com/bernard357/duckdb-vectors/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/duckdb_vectors"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: tests that take more than 200ms"]

[tool.mypy]
python_version = "3.12"
files = ["src/duckdb_vectors"]
warn_unused_ignores = true

# Optional-dependency backends ship no type stubs; their imports are lazy and
# isolated behind the embedder registry, so ignore their missing stubs rather
# than vendor third-party type packages.
[[tool.mypy.overrides]]
module = ["boto3", "fastembed", "llama_cpp"]
ignore_missing_imports = true
